<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Tracker - Global Launch Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
      body {
        background-color: #080a0f;
        color: #e2e8f0;
        font-family: 'Space Grotesk', sans-serif;
        background-image:
          radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
      }
      .glass {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .hero-glow {
        box-shadow: 0 0 80px -20px rgba(59, 130, 246, 0.3);
      }
      .btn-primary {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-10">
    <div class="max-w-7xl mx-auto" id="app">
      <header class="mb-12 flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
          <h1
            class="text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 tracking-tighter mb-2"
          >
            Space Tracker
          </h1>
          <p class="text-slate-400 text-xl font-medium">Real-time global mission telemetry</p>
        </div>
        <div
          id="sync-info"
          class="glass px-6 py-3 rounded-2xl text-slate-400 text-sm font-mono border-blue-500/20"
        ></div>
      </header>

      <div id="next-launch-hero" class="mb-20"></div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" id="launch-grid"></div>
    </div>

    <script>
      const data = {{DATA}};

      function init() {            document.getElementById('sync-info').innerHTML = '<span class="text-blue-400">●</span> SYNC: ' + new Date(data.timestamp).toLocaleTimeString();
          if (data.launches && data.launches.length > 0) {
              renderHero(data.launches[0]);
              renderGrid(data.launches.slice(1));
              startCountdowns(data.launches[0]);
          }
      }

      function renderHero(launch) {
          const hero = document.getElementById('next-launch-hero');
          const netDate = new Date(launch.net);
          const isReused = launch.is_reused ? '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[10px] font-bold border border-amber-500/30 ml-2">FLIGHT PROVEN</span>' : '';

          hero.innerHTML = `
              <div class="glass p-1 rounded-[2.5rem] hero-glow">
                  <div class="bg-[#0c111d] rounded-[2.25rem] overflow-hidden p-8 md:p-14 relative">
                      <div class="absolute top-0 right-0 w-1/3 h-full opacity-30 pointer-events-none"
                           style="background: radial-gradient(circle at 100% 0%, #3b82f6 0%, transparent 70%);"></div>

                      <div class="relative z-10 flex flex-col lg:flex-row gap-16 items-start">
                          <div class="flex-1">
                              <div class="flex items-center gap-3 mb-8">
                                  <span class="px-4 py-1.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-black tracking-widest uppercase">PRIMARY OBJECTIVE</span>
                                  <span class="px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-black tracking-widest uppercase">${launch.status.name}</span>
                              </div>
                              <h2 class="text-5xl md:text-7xl font-black mb-6 leading-tight tracking-tight">${launch.name}</h2>
                              <p class="text-slate-400 text-xl mb-10 leading-relaxed max-w-2xl">${launch.mission_description}</p>

                              <div class="grid grid-cols-2 sm:grid-cols-3 gap-10 mb-12">
                                  <div>
                                      <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-2">Agency</p>
                                      <p class="text-xl font-bold text-white">${launch.lsp_name}</p>
                                  </div>
                                  <div>
                                      <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-2">Vehicle</p>
                                      <p class="text-xl font-bold text-white">${launch.rocket_name}${isReused}</p>
                                  </div>
                                  <div class="hidden sm:block">
                                      <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-2">Pad</p>
                                      <p class="text-xl font-bold text-white">${launch.pad_name}</p>
                                  </div>
                              </div>

                              <div class="flex flex-wrap gap-4">
                                  ${launch.video_url ? `<a href="${launch.video_url}" target="_blank" class="btn-primary px-8 py-4 rounded-2xl font-black text-sm tracking-widest uppercase shadow-xl">Watch Live Stream</a>` : ''}
                                  <a href="https://www.google.com/maps/search/?api=1&query=${launch.latitude},${launch.longitude}" target="_blank" class="glass px-8 py-4 rounded-2xl font-black text-sm tracking-widest uppercase hover:bg-white/5 transition-colors">View Pad Location</a>
                              </div>
                          </div>

                          <div class="w-full lg:w-[400px]">
                              <div class="glass p-10 rounded-[2rem] border-blue-500/20 bg-blue-500/5">
                                  <p class="text-center text-blue-400 text-xs font-black uppercase tracking-[0.3em] mb-8">MISSION COUNTDOWN</p>
                                  <div class="flex justify-between items-center mb-10" id="hero-countdown"></div>
                                  <div class="pt-8 border-t border-white/5 text-center">
                                      <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Scheduled Liftoff</p>
                                      <p class="text-lg font-mono text-white">${netDate.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}</p>
                                      <p class="text-slate-600 text-[10px] mt-2 italic">${launch.location_name}</p>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          `;
      }

      function renderGrid(launches) {
          const grid = document.getElementById('launch-grid');
          grid.innerHTML = launches.map(launch => `
              <div class="glass rounded-[2rem] overflow-hidden group hover:border-blue-500/30 transition-all duration-500">
                  <div class="h-56 relative overflow-hidden">
                      <img src="${launch.image || 'https://images.unsplash.com/photo-1516849841032-87cbac2d88c7?auto=format&fit=crop&q=80&w=800'}"
                           class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-70">
                      <div class="absolute inset-0 bg-gradient-to-t from-[#080a0f] to-transparent"></div>
                      <div class="absolute bottom-6 left-6 right-6 flex justify-between items-end">
                          <div>
                              <p class="text-blue-400 text-[10px] font-black uppercase tracking-widest mb-1">${launch.lsp_name}</p>
                              <h3 class="text-xl font-bold leading-tight line-clamp-1">${launch.name}</h3>
                          </div>
                      </div>
                  </div>
                  <div class="p-8">
                      <p class="text-slate-400 text-sm leading-relaxed line-clamp-3 mb-8">${launch.mission_description}</p>
                      <div class="flex items-center justify-between pt-6 border-t border-white/5">
                          <span class="text-xs font-mono text-slate-500">${new Date(launch.net).toLocaleDateString()}</span>
                          <span class="px-3 py-1 rounded-lg bg-white/5 text-[10px] font-black tracking-widest uppercase text-slate-300">${launch.status.abbrev}</span>
                      </div>
                  </div>
              </div>
          `).join('');
      }

      function startCountdowns(launch) {
          const el = document.getElementById('hero-countdown');
          function update() {
              const now = new Date().getTime();
              const diff = new Date(launch.net).getTime() - now;

              if (diff < 0) {
                  el.innerHTML = '<span class="w-full text-center text-3xl font-black text-emerald-400 tracking-widest">' + (Math.abs(diff) < 7200000 ? 'LAUNCH IN PROGRESS' : 'MISSION CONCLUDED') + '</span>';
                  return;
              }

              const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
              el.innerHTML = [
                  {v: d, l: 'D'}, {v: h, l: 'H'}, {v: m, l: 'M'}, {v: s, l: 'S'}
              ].map(u => `
                  <div class="text-center">
                      <span class="text-4xl font-black tabular-nums">${u.v.toString().padStart(2, '0')}</span>
                      <span class="block text-[10px] font-black text-slate-600 mt-1">${u.l}</span>
                  </div>
              `).join('<span class="text-2xl font-black text-slate-800 mt-1">:</span>');
          }
          setInterval(update, 1000); update();
      }
      init();
    </script>
  </body>
</html>
